local {
  baseUrl = "https://www.quickpickdeal.com"
  api {
    basic {
      username = "user"
      password = "pass"
    }
    digest {
      username = "user"
      password = "pass"
    }
    bearerToken = "your-bearer-token"
    apiKey = "your-api-key"
    oauth1 {
      consumerKey = "your-consumer-key"
      consumerSecret = "your-consumer-secret"
      accessToken = "your-access-token"
      tokenSecret = "your-token-secret"
    }
    oauth2 {
      clientId = "your-client-id"
      clientSecret = "your-client-secret"
      tokenUrl = "https://www.quickpickdeal.com/api/Auth/GetBearerToken"
      scope = "read write"
      grantType = "client_credentials"
    }
    clientCert {
        p12FilePath ="abc"
        p12FilePassword="xyz"
    }
  }
}

